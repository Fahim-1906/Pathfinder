<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pathfinder AI - Career Advisor</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <header>
            <h1>Pathfinder AI</h1>
            <p class="subtitle">Discover your ideal career path with artificial intelligence</p>
        </header>

        <div class="search-box">
            <button id="micBtn" class="mic-btn" onclick="startVoiceRecognition()" title="Use Voice Assistant">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path>
                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                    <line x1="12" y1="19" x2="12" y2="22"></line>
                </svg>
            </button>
            <input type="text" id="query" placeholder="E.g., Biology careers..."
                onkeydown="if(event.key === 'Enter') sendQuery()">
            <button onclick="sendQuery()" id="searchBtn">Discover</button>
        </div>

        <div id="loading" class="loading">Analyzing career paths...</div>
        <div id="results" class="results-container"></div>
    </div>

    <script src="script.js"></script>
</body>

</html>
